services:
  - type: web
    name: duda-republish
    runtime: node
    buildCommand: npm install && npx playwright install chromium --with-deps
    startCommand: npm start
    plan: starter          # use 'free' if you're okay with sleep after 15min inactivity
    healthCheckPath: /health
    envVars:
      - key: DUDA_EMAIL
        sync: false        # set manually in Render dashboard
      - key: DUDA_PASSWORD
        sync: false
      - key: DUDA_SITE
        value: bc6015ea
      - key: WEBHOOK_TOKEN
        sync: false        # set manually in Render dashboard
      - key: DUDA_AUTH_BASE64
        sync: false        # paste base64 of duda_auth.json here
      - key: PORT
        value: 3000
