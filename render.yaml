services:
  - type: web
    name: duda-republish
    runtime: node
    # Install browsers into the project directory so they survive container restarts
    buildCommand: npm install && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright npx playwright install chromium --with-deps
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
      - key: DUDA_EMAIL
        sync: false
      - key: DUDA_PASSWORD
        sync: false
      - key: DUDA_SITE
        value: bc6015ea
      - key: WEBHOOK_TOKEN
        sync: false
      - key: DUDA_AUTH_BASE64
        sync: false
      - key: ZOHO_CLIQ_WEBHOOK
        sync: false
